# =============================================================================
# SpeedRead CI Pipeline
# Industry-standard continuous integration without Docker
# =============================================================================

name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

env:
  PYTHON_VERSION_PRIMARY: '3.11'

jobs:
  lint:
    name: 🔍 Code Quality (Lint)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python ${{ env.PYTHON_VERSION_PRIMARY }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION_PRIMARY }}

      - name: 📦 Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-lint-${{ hashFiles('backend/requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-lint-
            ${{ runner.os }}-pip-

      - name: 📚 Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: 🔍 Run flake8 (Linting)
        working-directory: ./backend
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  format:
    name: 🎨 Code Formatting
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python ${{ env.PYTHON_VERSION_PRIMARY }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION_PRIMARY }}

      - name: 📦 Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-format-${{ hashFiles('backend/requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-format-
            ${{ runner.os }}-pip-

      - name: 📚 Install Black
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

  test:
    name: 🧪 Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: [lint]

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    env:
      PYTHONPATH: .

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 📦 Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('backend/requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-
            ${{ runner.os }}-pip-

      - name: 📚 Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: 🧪 Test 1 - ORP Calculator (Unit Tests)
        working-directory: ./backend
        run: |
          pytest tests/test_orp_calculator.py -v --tb=short

      - name: 🧪 Test 2 - Text Processor (Unit Tests)
        working-directory: ./backend
        run: |
          pytest tests/test_text_processor.py -v --tb=short

      - name: 🧪 Test 3 - Word Preprocessor (Unit Tests)
        working-directory: ./backend
        run: |
          pytest tests/test_word_preprocessor.py -v --tb=short

      - name: 🧪 Test 4 - API Integration Tests
        working-directory: ./backend
        run: |
          pytest tests/test_api.py -v --tb=short

  coverage:
    name: 📊 Test Coverage
    runs-on: ubuntu-latest
    needs: [test]

    permissions:
      contents: read
      actions: write

    env:
      PYTHONPATH: .

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python ${{ env.PYTHON_VERSION_PRIMARY }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION_PRIMARY }}

      - name: 📦 Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-coverage-${{ hashFiles('backend/requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-coverage-
            ${{ runner.os }}-pip-

      - name: 📚 Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: 📊 Run tests with coverage
        working-directory: ./backend
        run: |
          pytest tests/ \
            --cov=. \
            --cov-report=term-missing \
            --cov-report=html:coverage_html \
            --cov-fail-under=70 \
            -v

      - name: 📤 Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage_html/
          retention-days: 14

  ci-success:
    name: ✅ CI Success
    runs-on: ubuntu-latest
    needs: [lint, format, test, coverage]
    if: always()

    permissions: {}

    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.lint.result }}" == "success" && \
                "${{ needs.format.result }}" == "success" && \
                "${{ needs.test.result }}" == "success" && \
                "${{ needs.coverage.result }}" == "success" ]]; then
            echo "✅ All checks passed!"
            exit 0
          else
            echo "❌ Some checks failed"
            echo "Lint:     ${{ needs.lint.result }}"
            echo "Format:   ${{ needs.format.result }}"
            echo "Test:     ${{ needs.test.result }}"
            echo "Coverage: ${{ needs.coverage.result }}"
            exit 1
          fi
