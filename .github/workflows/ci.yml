# =============================================================================
# SpeedRead CI Pipeline
# Industry-standard continuous integration without Docker
# =============================================================================

name: CI Pipeline

# =============================================================================
# TRIGGERS - When should this pipeline run?
# =============================================================================
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# =============================================================================
# GLOBAL PERMISSIONS - Restrict GITHUB_TOKEN to the minimum required
# =============================================================================
permissions:
  contents: read

env:
  PYTHON_VERSION_PRIMARY: '3.11'

# =============================================================================
# JOBS - The actual work happens here
# =============================================================================
jobs:
  # ---------------------------------------------------------------------------
  # JOB 1: Code Quality Check (Linting)
  # Runs first - no point testing code that doesn't meet standards
  # ---------------------------------------------------------------------------
  lint:
    name: 🔍 Code Quality (Lint)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python ${{ env.PYTHON_VERSION_PRIMARY }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION_PRIMARY }}

      - name: 📦 Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-lint-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-lint-
            ${{ runner.os }}-pip-

      - name: 📚 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: 🔍 Run flake8 (Linting)
        working-directory: ./backend
        run: |
          # Fail the build on Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Report style/complexity issues as warnings (non-blocking) so the
          # pipeline gives useful feedback without blocking iterative development
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  # ---------------------------------------------------------------------------
  # JOB 2: Code Formatting Check
  # Ensures consistent code style across the team
  # ---------------------------------------------------------------------------
  format:
    name: 🎨 Code Formatting
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python ${{ env.PYTHON_VERSION_PRIMARY }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION_PRIMARY }}

      - name: 📦 Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-format-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-format-
            ${{ runner.os }}-pip-

      - name: 📚 Install Black
        run: |
          python -m pip install --upgrade pip
          pip install "black==23.12.0"

      - name: 🎨 Check code formatting with Black
        working-directory: ./backend
        run: |
          # --check flag won't modify files, just check them
          # --diff shows what would change
          black --check --diff .

  # ---------------------------------------------------------------------------
  # JOB 3: Run Tests (Matrix Strategy)
  # Tests on multiple Python versions for compatibility
  # ---------------------------------------------------------------------------
  test:
    name: 🧪 Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: [lint]  # Wait for linting to pass first

    # Matrix Strategy: Test on multiple Python versions
    strategy:
      fail-fast: false  # Don't cancel other versions if one fails
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    # CRITICAL: Set PYTHONPATH so tests can import backend modules directly
    env:
      PYTHONPATH: .

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 📦 Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-
            ${{ runner.os }}-pip-

      - name: 📚 Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Run tests sequentially, one file at a time
      - name: 🧪 Test 1 - ORP Calculator (Unit Tests)
        working-directory: ./backend
        run: |
          echo "▶️ Running ORP Calculator tests..."
          pytest tests/test_orp_calculator.py -v --tb=short

      - name: 🧪 Test 2 - Text Processor (Unit Tests)
        working-directory: ./backend
        run: |
          echo "▶️ Running Text Processor tests..."
          pytest tests/test_text_processor.py -v --tb=short

      - name: 🧪 Test 3 - Word Preprocessor (Unit Tests)
        working-directory: ./backend
        run: |
          echo "▶️ Running Word Preprocessor tests..."
          pytest tests/test_word_preprocessor.py -v --tb=short

      - name: 🧪 Test 4 - API Integration Tests
        working-directory: ./backend
        run: |
          echo "▶️ Running API Integration tests..."
          pytest tests/test_api.py -v --tb=short

  # ---------------------------------------------------------------------------
  # JOB 4: Coverage Report
  # Runs after tests pass to generate a coverage report
  # ---------------------------------------------------------------------------
  coverage:
    name: 📊 Test Coverage
    runs-on: ubuntu-latest
    needs: [test]  # Only run if tests pass

    permissions:
      contents: read
      actions: write  # Required to upload the coverage artifact

    # CRITICAL: Set PYTHONPATH so tests can import backend modules directly
    env:
      PYTHONPATH: .

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python ${{ env.PYTHON_VERSION_PRIMARY }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION_PRIMARY }}

      - name: 📦 Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-coverage-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-coverage-
            ${{ runner.os }}-pip-

      - name: 📚 Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 📊 Run tests with coverage
        working-directory: ./backend
        run: |
          pytest tests/ \
            --cov=. \
            --cov-report=term-missing \
            --cov-report=html:coverage_html \
            --cov-fail-under=70 \
            -v

      - name: 📤 Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage_html/
          retention-days: 14

  # ---------------------------------------------------------------------------
  # JOB 5: Final Status Check
  # Single job that passes only if everything else passes
  # Good for branch protection rules
  # ---------------------------------------------------------------------------
  ci-success:
    name: ✅ CI Success
    runs-on: ubuntu-latest
    needs: [lint, format, test, coverage]
    if: always()  # Always run to report final status

    permissions: {}  # No repository access needed for this status-check job

    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.lint.result }}" == "success" && \
                "${{ needs.format.result }}" == "success" && \
                "${{ needs.test.result }}" == "success" && \
                "${{ needs.coverage.result }}" == "success" ]]; then
            echo "✅ All checks passed!"
            exit 0
          else
            echo "❌ Some checks failed"
            echo "Lint:     ${{ needs.lint.result }}"
            echo "Format:   ${{ needs.format.result }}"
            echo "Test:     ${{ needs.test.result }}"
            echo "Coverage: ${{ needs.coverage.result }}"
            exit 1
          fi
