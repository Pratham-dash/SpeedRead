name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLASK_ENV: testing
  MINIMUM_COVERAGE: 70

jobs:
  # ============================================================
  # Stage 1: Code Quality
  # ============================================================
  lint:
    name: Code Quality (flake8)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check syntax errors (critical)
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Check style (non-blocking)
        run: |
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  # ============================================================
  # Stage 2: Security Scanning
  # ============================================================
  security:
    name: Security Scanning
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit pip-audit

      - name: Run Bandit SAST
        run: |
          bandit -r services/ app.py api/ -ll --format txt || true

      - name: Run pip-audit dependency scan
        run: |
          pip-audit || true

  # ============================================================
  # Stage 3: Unit Tests (Multi-Python)
  # ============================================================
  unit-tests:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: [lint, security]
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run all tests
        run: |
          pytest tests/ -v --tb=short

  # ============================================================
  # Stage 4: Coverage & API Tests
  # ============================================================
  coverage:
    name: Coverage & API Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest with coverage
        run: |
          pytest tests/ -v --tb=short \
            --cov=services --cov=app --cov=api \
            --cov-report=html \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=${{ env.MINIMUM_COVERAGE }}

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: backend/htmlcov/
          retention-days: 7

  # ============================================================
  # Stage 5: Build Verification
  # ============================================================
  build:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: coverage
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Flask app starts correctly
        run: |
          python -c "
          from app import create_app
          app = create_app()
          print('Flask app created successfully')
          "

      - name: Verify all service imports
        run: |
          python -c "
          from services.orp_calculator import ORPCalculator
          from services.text_processor import TextProcessor
          from services.word_preprocessor import WordPreprocessor
          print('All services imported successfully')
          "

  # ============================================================
  # Stage 6: Deploy Staging
  # ============================================================
  deploy-staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to staging
        run: |
          echo "Deploying to staging environment..."
          # Add your staging deployment commands here, for example:
          # - Render: curl -X POST $RENDER_STAGING_DEPLOY_HOOK
          # - Railway: railway up --environment staging
          # - Heroku: git push heroku-staging main
          echo "Staging deployment complete."

  # ============================================================
  # Stage 7: Deploy Production
  # ============================================================
  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to production
        run: |
          echo "Deploying to production environment..."
          # Add your production deployment commands here, for example:
          # - Render: curl -X POST $RENDER_PRODUCTION_DEPLOY_HOOK
          # - Railway: railway up --environment production
          # - Heroku: git push heroku main
          echo "Production deployment complete."
